<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivek Polymers - Inventory Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 600: '#1e40af', 700: '#1e3a8a', 900: '#0f172a' },
                        accent: { 400: '#22d3ee', 500: '#06b6d4' },
                        emerald: { 500: '#10b981', 600: '#059669' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(71, 85, 105, 0.4); }
        .glass-nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(100, 116, 139, 0.3); }
        .low-stock { border-color: rgba(239, 68, 68, 0.5) !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 min-h-screen">

    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass-card rounded-2xl p-8 max-w-md w-full">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-primary-600 to-primary-700 rounded-xl flex items-center justify-center mx-auto mb-4" style="clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);">
                    <span class="text-white font-bold text-2xl">VP</span>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">Vivek Polymers</h1>
                <p class="text-slate-400 text-sm">Inventory Management</p>
            </div>
            <a href="./" class="inline-flex items-center gap-2 text-cyan-400 hover:text-cyan-300 text-sm mb-6 transition-colors">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2">Select Role</label>
                    <select id="roleSelect" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white focus:border-cyan-500 focus:outline-none">
                        <option value="admin">Administrator</option>
                        <option value="store_admin">Store Manager</option>
                        <option value="prod_admin">Production Manager</option>
                        <option value="qc_admin">Quality Inspector</option>
                        <option value="sales_admin">Sales Manager</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2">Password</label>
                    <input type="password" id="passwordInput" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white focus:border-cyan-500 focus:outline-none" placeholder="Enter password">
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-emerald-500 text-white font-semibold rounded-xl hover:shadow-lg hover:shadow-cyan-500/30 transition-all">
                    Login <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardScreen" class="hidden min-h-screen">
        <nav class="glass-nav border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-primary-600 to-primary-700 rounded-xl flex items-center justify-center" style="clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);">
                        <span class="text-white font-bold text-sm">VP</span>
                    </div>
                    <div>
                        <h1 class="text-white font-bold text-lg">VIVEK POLYMERS</h1>
                        <p class="text-cyan-400 text-xs">Inventory Dashboard</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p class="text-white text-sm font-semibold" id="userFullName">-</p>
                        <p class="text-slate-400 text-xs" id="userRole">-</p>
                    </div>
                    <button onclick="logout()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm transition-all">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto px-6 py-8">
            <!-- Tab Navigation -->
            <div class="flex gap-2 mb-8">
                <button onclick="showTab('inventory')" id="tabInventory" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold bg-cyan-500 text-white transition-all">
                    <i class="fas fa-boxes-stacked mr-2"></i>Inventory
                </button>
                <button onclick="showTab('usage')" id="tabUsage" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-700 text-slate-300 transition-all">
                    <i class="fas fa-clipboard-list mr-2"></i>Usage Log
                </button>
            </div>

            <!-- Inventory Tab -->
            <div id="inventoryTab">
                <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                    <h2 class="text-2xl font-bold text-white">Current Stock</h2>
                    <div class="flex gap-3">
                        <button onclick="loadInventory()" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm transition-all">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                        <button id="addStockBtn" onclick="openAddStockModal()" class="hidden px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-emerald-500 text-white font-semibold rounded-xl text-sm hover:shadow-lg transition-all">
                            <i class="fas fa-plus mr-2"></i>Add Stock
                        </button>
                    </div>
                </div>
                <div id="inventoryGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <!-- Usage Log Tab -->
            <div id="usageTab" class="hidden">
                <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                    <h2 class="text-2xl font-bold text-white">Usage History</h2>
                    <div class="flex items-center gap-3">
                        <input type="date" id="usageDateFilter" onchange="loadUsageLog()" class="px-4 py-2 bg-slate-800 border border-slate-600 rounded-xl text-white text-sm focus:border-cyan-500 focus:outline-none">
                        <button onclick="clearUsageDateFilter()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm rounded-xl transition-all">Clear</button>
                    </div>
                </div>
                <div id="usageGrid" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- Add Stock Modal (Admin only) -->
    <div id="addStockModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6 z-50">
        <div class="glass-card rounded-2xl p-8 max-w-lg w-full">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-white">Add / Update Stock</h3>
                <button onclick="closeAddStockModal()" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="addStockForm" class="space-y-4">
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2">Raw Material Name</label>
                    <input type="text" id="rmName" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white focus:border-cyan-500 focus:outline-none" placeholder="e.g., ABS Black" required>
                </div>
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2">Party Name (Supplier)</label>
                    <input type="text" id="partyName" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white focus:border-cyan-500 focus:outline-none" placeholder="e.g., Supreme Polymers" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-300 text-sm font-medium mb-2">Bags</label>
                        <input type="number" id="bags" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white focus:border-cyan-500 focus:outline-none" min="0" required>
                    </div>
                    <div>
                        <label class="block text-slate-300 text-sm font-medium mb-2">Qty (KG)</label>
                        <input type="number" step="0.01" id="qtyKg" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white focus:border-cyan-500 focus:outline-none" min="0" required>
                    </div>
                </div>
                <p class="text-slate-500 text-xs"><i class="fas fa-info-circle mr-1"></i>If this material + party already exists, the quantity will be added to existing stock.</p>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-emerald-500 text-white font-semibold rounded-xl hover:shadow-lg transition-all">
                    Add Stock
                </button>
            </form>
        </div>
    </div>

    <!-- Log Usage Modal -->
    <div id="logUsageModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6 z-50">
        <div class="glass-card rounded-2xl p-8 max-w-lg w-full">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-white">Log Usage</h3>
                <button onclick="closeLogUsageModal()" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="logUsageForm" class="space-y-4">
                <input type="hidden" id="usageInventoryId">
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2">Material</label>
                    <p id="usageMaterialName" class="text-white font-semibold"></p>
                </div>
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2">Available Stock</label>
                    <p id="usageAvailable" class="text-emerald-400 font-semibold"></p>
                </div>
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2">Qty Used (KG)</label>
                    <input type="number" step="0.01" id="usageQty" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white focus:border-cyan-500 focus:outline-none" min="0.01" required>
                </div>
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2">Notes (optional)</label>
                    <input type="text" id="usageNotes" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white focus:border-cyan-500 focus:outline-none" placeholder="e.g., Production batch #12">
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-semibold rounded-xl hover:shadow-lg transition-all">
                    Deduct from Stock
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pooemfcjiopldnojlrso.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvb2VtZmNqaW9wbGRub2pscnNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MTM3NDIsImV4cCI6MjEwOTE4OTc0Mn0.qOImzrhI12HdaxTaAezUteH5nlQuucYHK8P8w1cdI5c';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let inventoryData = [];

        // === LOGIN ===
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const role = document.getElementById('roleSelect').value;
            const password = document.getElementById('passwordInput').value;
            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Logging in...';

            try {
                const { data, error } = await db.from('users').select('*')
                    .eq('username', role).eq('password', password).eq('is_active', true);

                if (error || !data || data.length === 0) {
                    alert('Invalid credentials');
                    btn.disabled = false;
                    btn.innerHTML = 'Login <i class="fas fa-arrow-right ml-2"></i>';
                    return;
                }

                const user = data[0];
                currentUser = { username: user.username, role: user.role, full_name: user.full_name };
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                document.getElementById('userFullName').textContent = currentUser.full_name;
                document.getElementById('userRole').textContent = user.role.replace('_', ' ').toUpperCase();

                // Show Add Stock button for admin
                if (currentUser.role === 'admin') {
                    document.getElementById('addStockBtn').classList.remove('hidden');
                }
                loadInventory();
            } catch (err) {
                alert('Connection error: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = 'Login <i class="fas fa-arrow-right ml-2"></i>';
            }
        });

        function logout() {
            currentUser = null;
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('addStockBtn').classList.add('hidden');
            const btn = document.querySelector('#loginForm button[type="submit"]');
            btn.disabled = false;
            btn.innerHTML = 'Login <i class="fas fa-arrow-right ml-2"></i>';
            document.getElementById('passwordInput').value = '';
        }

        // === TABS ===
        function showTab(tab) {
            document.getElementById('inventoryTab').classList.toggle('hidden', tab !== 'inventory');
            document.getElementById('usageTab').classList.toggle('hidden', tab !== 'usage');
            document.getElementById('tabInventory').className = 'tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold transition-all ' + (tab === 'inventory' ? 'bg-cyan-500 text-white' : 'bg-slate-700 text-slate-300');
            document.getElementById('tabUsage').className = 'tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold transition-all ' + (tab === 'usage' ? 'bg-cyan-500 text-white' : 'bg-slate-700 text-slate-300');
            if (tab === 'usage') loadUsageLog();
        }

        // === LOAD INVENTORY ===
        async function loadInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = '<div class="col-span-full glass-card rounded-xl p-8 text-center"><p class="text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</p></div>';

            const { data: items, error } = await db.from('inventory').select('*').order('raw_material');
            if (error) { grid.innerHTML = '<p class="text-red-400 col-span-full text-center p-8">' + error.message + '</p>'; return; }

            // Get total usage per inventory item
            const { data: usages } = await db.from('usage_log').select('inventory_id, qty_used_kg');
            const usageMap = {};
            (usages || []).forEach(u => {
                usageMap[u.inventory_id] = (usageMap[u.inventory_id] || 0) + parseFloat(u.qty_used_kg);
            });

            inventoryData = (items || []).map(item => ({
                ...item,
                total_used: usageMap[item.id] || 0,
                remaining: parseFloat(item.qty_kg) - (usageMap[item.id] || 0)
            }));

            if (inventoryData.length === 0) {
                grid.innerHTML = '<div class="col-span-full glass-card rounded-xl p-8 text-center"><p class="text-slate-400">No inventory items. Admin can add stock.</p></div>';
                return;
            }

            grid.innerHTML = inventoryData.map(item => {
                const pct = item.qty_kg > 0 ? (item.remaining / item.qty_kg * 100) : 0;
                const isLow = pct < 20;
                const barColor = isLow ? 'bg-red-500' : pct < 50 ? 'bg-amber-500' : 'bg-emerald-500';

                return `
                <div class="glass-card rounded-xl p-5 ${isLow ? 'low-stock' : ''}">
                    <div class="flex items-start justify-between mb-3">
                        <div>
                            <h3 class="text-lg font-bold text-white">${item.raw_material}</h3>
                            <p class="text-slate-400 text-sm">${item.party_name}</p>
                        </div>
                        <span class="px-2 py-1 rounded-lg text-xs font-semibold ${isLow ? 'bg-red-500/20 text-red-400' : 'bg-emerald-500/20 text-emerald-400'}">
                            ${isLow ? 'LOW' : 'OK'}
                        </span>
                    </div>
                    <div class="grid grid-cols-3 gap-3 mb-3">
                        <div><p class="text-slate-500 text-xs">Total Stock</p><p class="text-white font-semibold text-sm">${parseFloat(item.qty_kg).toFixed(1)} kg</p></div>
                        <div><p class="text-slate-500 text-xs">Used</p><p class="text-amber-400 font-semibold text-sm">${item.total_used.toFixed(1)} kg</p></div>
                        <div><p class="text-slate-500 text-xs">Remaining</p><p class="${isLow ? 'text-red-400' : 'text-emerald-400'} font-semibold text-sm">${item.remaining.toFixed(1)} kg</p></div>
                    </div>
                    <div class="mb-3"><p class="text-slate-500 text-xs mb-1">Bags: ${item.bags}</p>
                        <div class="w-full h-2 bg-slate-700 rounded-full overflow-hidden">
                            <div class="${barColor} h-full rounded-full transition-all" style="width:${Math.max(pct,2)}%"></div>
                        </div>
                    </div>
                    <button onclick="openLogUsageModal(${item.id})" class="w-full py-2 bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 rounded-lg text-sm font-medium transition-all">
                        <i class="fas fa-minus-circle mr-2"></i>Log Usage
                    </button>
                </div>`;
            }).join('');
        }

        // === LOAD USAGE LOG ===
        async function loadUsageLog() {
            const grid = document.getElementById('usageGrid');
            grid.innerHTML = '<div class="glass-card rounded-xl p-8 text-center"><p class="text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</p></div>';

            let query = db.from('usage_log').select('*, inventory(raw_material, party_name)').order('used_at', { ascending: false });
            
            const dateFilter = document.getElementById('usageDateFilter').value;
            if (dateFilter) {
                query = query.gte('used_at', dateFilter + 'T00:00:00').lte('used_at', dateFilter + 'T23:59:59');
            }

            const { data, error } = await query;
            if (error) { grid.innerHTML = '<p class="text-red-400 text-center p-8">' + error.message + '</p>'; return; }

            if (!data || data.length === 0) {
                grid.innerHTML = '<div class="glass-card rounded-xl p-8 text-center"><p class="text-slate-400">No usage entries found</p></div>';
                return;
            }

            // Group by date
            const grouped = {};
            data.forEach(entry => {
                const date = (entry.used_at || '').split('T')[0];
                if (!grouped[date]) grouped[date] = [];
                grouped[date].push(entry);
            });

            let html = '';
            Object.keys(grouped).sort((a, b) => b.localeCompare(a)).forEach(date => {
                const displayDate = new Date(date + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                const dayTotal = grouped[date].reduce((sum, e) => sum + parseFloat(e.qty_used_kg), 0);

                html += `<div class="mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-slate-400 text-sm font-semibold flex items-center gap-2"><i class="fas fa-calendar-day text-cyan-500"></i> ${displayDate}</h3>
                        <span class="text-amber-400 text-sm font-semibold">${dayTotal.toFixed(1)} kg used</span>
                    </div>`;

                grouped[date].forEach(entry => {
                    const mat = entry.inventory ? entry.inventory.raw_material : 'Unknown';
                    const party = entry.inventory ? entry.inventory.party_name : '';
                    const time = new Date(entry.used_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                    html += `
                    <div class="glass-card rounded-lg p-4 mb-2 flex items-center justify-between">
                        <div>
                            <p class="text-white font-semibold text-sm">${mat} <span class="text-slate-500 font-normal">· ${party}</span></p>
                            <p class="text-slate-500 text-xs">${time} · by ${entry.used_by}${entry.notes ? ' · ' + entry.notes : ''}</p>
                        </div>
                        <span class="text-amber-400 font-bold text-lg">-${parseFloat(entry.qty_used_kg).toFixed(1)} kg</span>
                    </div>`;
                });
                html += '</div>';
            });

            grid.innerHTML = html;
        }

        function clearUsageDateFilter() {
            document.getElementById('usageDateFilter').value = '';
            loadUsageLog();
        }

        // === ADD STOCK (Admin) ===
        function openAddStockModal() { document.getElementById('addStockModal').classList.remove('hidden'); }
        function closeAddStockModal() { document.getElementById('addStockModal').classList.add('hidden'); }

        document.getElementById('addStockForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const rm = document.getElementById('rmName').value.trim();
            const party = document.getElementById('partyName').value.trim();
            const bags = parseInt(document.getElementById('bags').value);
            const qty = parseFloat(document.getElementById('qtyKg').value);
            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Saving...';

            // Check if exists
            const { data: existing } = await db.from('inventory').select('*')
                .eq('raw_material', rm).eq('party_name', party);

            if (existing && existing.length > 0) {
                // Add to existing
                const item = existing[0];
                const { error } = await db.from('inventory').update({
                    bags: item.bags + bags,
                    qty_kg: parseFloat(item.qty_kg) + qty,
                    updated_at: new Date().toISOString()
                }).eq('id', item.id);

                if (error) { alert('Error: ' + error.message); }
                else { alert('Stock added to existing entry: ' + rm); }
            } else {
                // Create new
                const { error } = await db.from('inventory').insert({
                    raw_material: rm, party_name: party, bags: bags, qty_kg: qty, added_by: currentUser.username
                });
                if (error) { alert('Error: ' + error.message); }
                else { alert('New stock entry created: ' + rm); }
            }

            btn.disabled = false;
            btn.textContent = 'Add Stock';
            this.reset();
            closeAddStockModal();
            loadInventory();
        });

        // === LOG USAGE ===
        function openLogUsageModal(inventoryId) {
            const item = inventoryData.find(i => i.id === inventoryId);
            if (!item) return;
            document.getElementById('usageInventoryId').value = inventoryId;
            document.getElementById('usageMaterialName').textContent = item.raw_material + ' (' + item.party_name + ')';
            document.getElementById('usageAvailable').textContent = item.remaining.toFixed(1) + ' kg';
            document.getElementById('usageQty').max = item.remaining;
            document.getElementById('logUsageModal').classList.remove('hidden');
        }
        function closeLogUsageModal() { document.getElementById('logUsageModal').classList.add('hidden'); }

        document.getElementById('logUsageForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const invId = parseInt(document.getElementById('usageInventoryId').value);
            const qty = parseFloat(document.getElementById('usageQty').value);
            const notes = document.getElementById('usageNotes').value.trim();
            const item = inventoryData.find(i => i.id === invId);

            if (qty > item.remaining) {
                alert('Cannot use more than available stock (' + item.remaining.toFixed(1) + ' kg)');
                return;
            }

            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Saving...';

            const { error } = await db.from('usage_log').insert({
                inventory_id: invId,
                qty_used_kg: qty,
                used_by: currentUser.full_name,
                notes: notes || null
            });

            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('Usage logged: -' + qty + ' kg from ' + item.raw_material);
            }

            btn.disabled = false;
            btn.innerHTML = 'Deduct from Stock';
            this.reset();
            closeLogUsageModal();
            loadInventory();
        });
    </script>
</body>
</html>
